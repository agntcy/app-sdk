---
name: sdk-release-python

on:
  push:
    tags:
      - "v*" # Only trigger on tag push (created by release-please)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history: the tag must be reachable from main

      - name: Fetch main
        # A tag-push checkout does not guarantee origin/main exists locally.
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Check the tag is a prepared release
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_tag.py "$TAG"

  build-sdk-wheel:
    name: SDK Python wheel
    needs:
      - validate-tag
    uses: ./.github/workflows/reusable-python-build-wheel.yaml

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-sdk-wheel
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel*
          merge-multiple: true
          path: ./dist

      - name: Show files
        run: ls -l ./dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: ./dist
