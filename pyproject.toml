[project]
name = "agntcy-app-sdk"
version = "0.6.0"
description = "Agntcy Application SDK for Python"
authors = [{ name = "Cody Hartsook", email = "codyhartsook@gmail.com" }]
requires-python = ">=3.12,<4.0"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "a2a-sdk==1.2.3",
    "nats-py>=2.10.0,<3",
    "structlog>=24.1.0",
    "uvicorn>=0.29.0",
    "mcp[cli]>=1.10.1",
    "httpx>=0.28.1",
    "ioa-observe-sdk==1.1.0",
    "slim-bindings>=3.3.6,<4",
    "agntcy-identity-service-sdk==0.0.7",
    "slima2a==0.9.3",
    "agntcy-dir>=1.0.0",
    "grpcio-tools>=1.84.0",
]

[project.urls]
"Homepage" = "https://github.com/agntcy/app-sdk"
"Bug Tracker" = "https://github.com/agntcy/app-sdk/issues"

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.17.2",
    "pytest-cov==4.1.0",
    "typing-extensions==4.15.0",
    "tiktoken==0.8.0",
    "openai==1.109.1",
    "langchain-anthropic==0.3.21",
    "langchain-openai==0.3.34",
    "mypy==1.19.1",
    "types-protobuf==6.32.1.20260221",
    "ruff==0.15.2",
    "types-psutil==7.2.2.20260906",
    "types-docker==7.2.0.20261006",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "examples"]
mypy_path = "src:stubs"
explicit_package_bases = true
# One bar for library, tests and examples. In tests, Any is limited to
# deliberately wrong calls, catch-all fakes (*args/**kwargs) and JSON payloads;
# values from MagicMock are Any by nature and need no annotation.
strict = true
warn_unused_configs = true
